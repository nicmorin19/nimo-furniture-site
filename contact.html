<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | NiMo Support & Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#0F172A', secondary: '#475569', accent: '#F8FAFC', nimoRed: '#DC2626' }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-primary antialiased pt-20">

    <header class="fixed w-full top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
            <a href="index.html" class="group">
                <div class="bg-nimoRed text-white font-bold text-xl px-4 py-2 transition-transform group-hover:scale-105">NiMo</div>
            </a>
            <nav class="hidden md:flex space-x-8 items-center">
                <a href="product.html" class="text-sm font-medium text-secondary hover:text-nimoRed transition">Products</a>
                <a href="services.html" class="text-sm font-medium text-secondary hover:text-nimoRed transition">Services</a>
                <a href="about.html" class="text-sm font-medium text-secondary hover:text-nimoRed transition">About</a>
                <a href="contact.html" class="text-sm font-medium text-nimoRed border-b-2 border-nimoRed pb-1">Contact</a>
            </nav>
            <a href="quote.html" class="hidden md:block bg-nimoRed text-white px-5 py-2.5 text-sm font-medium hover:bg-red-700 transition">Request Quote</a>
        </div>
    </header>

    <section class="py-24">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-2 gap-16">
            
            <div>
                <h1 class="text-4xl font-bold mb-6">Get in Touch</h1>
                <p class="text-secondary text-lg mb-12">Whether you're looking for a single chair for your home office or outfitting a 500-person HQ, our team is here to help.</p>
                
                <div class="space-y-8">
                    <div class="flex items-start gap-4">
                        <div class="bg-accent p-3 text-nimoRed">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <div>
                            <h4 class="font-bold">Email Us</h4>
                            <p class="text-secondary">hello@nimo-office.com</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-4">
                        <div class="bg-accent p-3 text-nimoRed">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </div>
                        <div>
                            <h4 class="font-bold">Visit Our Showroom</h4>
                            <p class="text-secondary">123 Design District, Suite 400<br>New York, NY 10012</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-accent p-8 lg:p-12 border border-gray-100">
                <form action="#" method="POST" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium mb-2">Full Name</label>
                            <input type="text" class="w-full border border-gray-200 px-4 py-3 focus:outline-none focus:border-nimoRed transition" placeholder="Jane Doe">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Email Address</label>
                            <input type="email" class="w-full border border-gray-200 px-4 py-3 focus:outline-none focus:border-nimoRed transition" placeholder="jane@company.com">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">How can we help?</label>
                        <select class="w-full border border-gray-200 px-4 py-3 focus:outline-none focus:border-nimoRed transition">
                            <option>Bulk Order Inquiry</option>
                            <option>Product Support</option>
                            <option>Space Planning Consultation</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Message</label>
                        <textarea rows="4" class="w-full border border-gray-200 px-4 py-3 focus:outline-none focus:border-nimoRed transition" placeholder="Tell us about your project..."></textarea>
                    </div>
                    <button type="submit" class="w-full bg-nimoRed text-white font-bold py-4 hover:bg-red-700 transition">Send Message</button>
                </form>
            </div>
        </div>
    </section>

</body>
</html>
