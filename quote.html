<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Quote | NiMo Workspace Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#0F172A', secondary: '#475569', accent: '#F8FAFC', nimoRed: '#DC2626' }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-primary antialiased pt-20">

    <header class="fixed w-full top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex-shrink-0 flex items-center group">
                    <div class="bg-nimoRed text-white font-bold text-xl px-4 py-2 tracking-tight transition-transform duration-300 group-hover:scale-105">NiMo</div>
                </a>
                <nav class="hidden md:flex space-x-8 h-full items-center">
                    <div class="relative group h-full flex items-center">
                        <button class="flex items-center text-sm font-medium text-secondary group-hover:text-nimoRed transition">
                            Products
                            <svg class="ml-1 w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div class="absolute top-full left-0 w-64 bg-white border border-gray-100 shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform translate-y-2 group-hover:translate-y-0">
                            <div class="py-2">
                                <a href="product.html" class="block px-6 py-3 text-sm text-secondary hover:bg-accent hover:text-nimoRed transition font-medium">Chairs</a>
                                <a href="#" class="block px-6 py-3 text-sm text-secondary hover:bg-accent hover:text-nimoRed transition">Desks</a>
                                <a href="#" class="block px-6 py-3 text-sm text-secondary hover:bg-accent hover:text-nimoRed transition">Tables</a>
                                <a href="#" class="block px-6 py-3 text-sm text-secondary hover:bg-accent hover:text-nimoRed transition">Cubicles and Partitions</a>
                                <div class="border-t border-gray-50 my-1"></div>
                                <a href="#" class="block px-6 py-3 text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-nimoRed transition">View All Collections</a>
                            </div>
                        </div>
                    </div>
                    <a href="services.html" class="text-sm font-medium text-secondary hover:text-nimoRed transition">Services</a>
                    <a href="about.html" class="text-sm font-medium text-secondary hover:text-nimoRed transition">About</a>
                    <a href="contact.html" class="text-sm font-medium text-secondary hover:text-nimoRed transition">Contact</a>
                </nav>
                <div class="hidden md:flex items-center space-x-4">
                    <a href="quote.html" class="bg-nimoRed text-white px-5 py-2.5 text-sm font-medium hover:bg-red-700 transition shadow-lg shadow-red-900/10">Request Quote</a>
                </div>
            </div>
        </div>
    </header>

    <section class="py-20 lg:py-28">
        <div class="max-w-4xl mx-auto px-4">
            <div class="text-center mb-12">
                <h1 class="text-4xl font-bold mb-4">Request a Project Quote</h1>
                <p class="text-secondary">Upload your floor plans or project requirements and our team will get back to you within 24 hours.</p>
            </div>

            <div class="bg-white border border-gray-100 shadow-2xl p-8 lg:p-12">
                <form action="YOUR_FUTURE_EMAIL_SERVICE_URL" method="POST" enctype="multipart/form-data" class="space-y-8">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold mb-2 uppercase tracking-tight text-gray-500">Company Name</label>
                            <input type="text" name="company" required class="w-full border-b-2 border-gray-200 py-3 focus:outline-none focus:border-nimoRed transition bg-transparent" placeholder="NiMo Design Co.">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-2 uppercase tracking-tight text-gray-500">Work Email</label>
                            <input type="email" name="email" required class="w-full border-b-2 border-gray-200 py-3 focus:outline-none focus:border-nimoRed transition bg-transparent" placeholder="name@company.com">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold mb-2 uppercase tracking-tight text-gray-500">Project Requirements</label>
                        <textarea name="requirements" rows="6" required class="w-full border-2 border-gray-100 p-4 focus:outline-none focus:border-nimoRed transition bg-accent" placeholder="Tell us about your space, head count, and preferred styles..."></textarea>
                    </div>

                    <div class="border-2 border-dashed border-gray-200 p-8 text-center hover:border-nimoRed transition group relative">
                        <input type="file" name="attachment" id="file-upload" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <div class="space-y-2">
                            <svg class="w-10 h-10 mx-auto text-gray-400 group-hover:text-nimoRed transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <p class="text-sm font-medium" id="file-name">Click to upload floor plans or specs <span class="text-nimoRed">(PDF, PNG, JPG)</span></p>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="w-full bg-nimoRed text-white py-5 font-bold text-lg hover:bg-red-700 transition shadow-xl shadow-red-900/20">
                            Submit Quote Request
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script>
        const fileInput = document.getElementById('file-upload');
        const fileNameDisplay = document.getElementById('file-name');
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileNameDisplay.textContent = `Selected: ${e.target.files[0].name}`;
                fileNameDisplay.classList.add('text-nimoRed');
            }
        });
    </script>

</body>
</html>
